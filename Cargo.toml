[package]
name = "unftp-site-hash"
version = "0.1.0"
description = "Adds a SITE HASH command to libunftp, supporting SHA-256, SHA-1, MD5 and CRC32 file hashing"
authors = ["Martin Cowie <martinjcowie@gmail.com>"]
edition = "2024"
license = "Apache-2.0"
keywords = ["libunftp", "unftp", "ftp", "ftps", "hash"]
categories = ["network-programming"]
documentation = "https://docs.rs/unftp-site-hash"
homepage = "https://github.com/martin-cowie/unftp-site-hash"
repository = "https://github.com/martin-cowie/unftp-site-hash"
readme = "README.md"

# NOTE: libunftp's `SiteCommandHandler` extension point (what this crate hooks into) has not
# been released to crates.io yet, it only exists on the `master` branch as of 2026-07-26. Once
# a release containing it ships, switch these back to version dependencies (libunftp = "0.24",
# unftp-core = "0.1") and drop the `[patch]` section below.
[dependencies]
async-trait = "0.1.91"
crc32fast = "1.5.0"
libunftp = { git = "https://github.com/bolcom/libunftp", branch = "master" }
md-5 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["io-util"] }
unftp-core = { git = "https://github.com/bolcom/libunftp", branch = "master" }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
unftp-sbe-fs = { git = "https://github.com/bolcom/libunftp", branch = "master" }

[lints.rust]
missing_docs = "deny"

[lints.clippy]
all = "deny"
